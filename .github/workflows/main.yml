name: Deploy to Github Pages

# The site moved to smolevich.com; this repo only serves redirect stubs from ./site.
on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    # keep_files is false by default, so the old Hugo build in gh-pages is wiped.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./site
